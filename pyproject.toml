[project]
name = "prophet-rag"
version = "0.1.0"
description = "Unified prophet persona RAG system using local LLMs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "langchain>=0.3.0",
    "langchain-text-splitters>=1.1.0",
    "langchain-ollama>=0.2.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.6.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.1.0",
    "html2text>=2024.2.26",
    "typer>=0.15.0",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
ingest = "app.commands:ingest"
serve = "app.commands:serve"
