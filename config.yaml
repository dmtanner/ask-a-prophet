# Configuration for Prophet RAG system

# Answer model. Env vars in .env.example override any of these.
llm:
  provider: "ollama"     # ollama (local) | anthropic (API key from ANTHROPIC_API_KEY)
  model: ""              # empty = provider default: ollama.llm_model or claude-opus-5
  max_tokens: 16000
  effort: "medium"       # anthropic only: low | medium | high

# Ollama: embeddings always run here; the answer model too when llm.provider is ollama
ollama:
  base_url: "http://localhost:11434"
  llm_model: "qwen3.6:latest"
  embed_model: "nomic-embed-text"

# ChromaDB persistence
chroma:
  persist_directory: "./chroma_persistent_db"
  collection_name: "prophet_quotes"

# Document ingestion
ingestion:
  sources:
    general_conference:
      enabled: true
      max_ids: -1
      per_request_delay: 0.5
      
    journal_of_discourses:
      enabled: true

# Text splitting
splitting:
  chunk_size: 800
  chunk_overlap: 100

# Server
server:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins: ["*"]          # set to your site origin in production
  rate_limit_per_minute: 10    # per client IP on /query; 0 disables
